name: Deploy quiz application
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quiz-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      PUBLISHER_CONTACT: ${{ vars.PUBLISHER_CONTACT }}
      NEXT_PUBLIC_API_URL: https://api.nouvel-ordre.fr
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/configure-production.mjs
      - run: npm run content:check && npm run typecheck && npm test && npm run build
      - run: npm run db:remote
      - run: npm run deploy -w @nouvel-ordre/api
      - run: npm run deploy -w @nouvel-ordre/web
